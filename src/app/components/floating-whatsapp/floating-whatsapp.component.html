<div class="whatsapp-fab-container" [class.active]="isOpen">
  <!-- Interactive Quick Menu Popover -->
  <div class="fab-menu-popover glass-card" *ngIf="isOpen">
    <div class="popover-header">
      <div class="header-avatar">
        <span class="material-symbols-outlined">bolt</span>
      </div>
      <div class="header-text">
        <h4>{{ config.businessName }}</h4>
        <span class="online-indicator">
          <span class="dot"></span> Online • Fast Response (30 Min)
        </span>
      </div>
      <button class="btn-close-pop" (click)="closeMenu()" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="popover-body">
      <p class="greeting-text">
        வணக்கம்! How can our electrical team help you today?
      </p>

      <div class="quick-options">
        <button class="opt-btn" (click)="openWhatsApp('tools')">
          <span class="opt-icon tools-icon">
            <span class="material-symbols-outlined">build</span>
          </span>
          <div class="opt-info">
            <strong>Tool & Material Quote</strong>
            <span>Cordless tools, wire coils, switchgears</span>
          </div>
        </button>

        <button class="opt-btn" (click)="openWhatsApp('emergency')">
          <span class="opt-icon emergency-icon">
            <span class="material-symbols-outlined">warning</span>
          </span>
          <div class="opt-info">
            <strong>Emergency Breakdown</strong>
            <span>Tripped MCB, burning smell, power cut</span>
          </div>
        </button>

        <button class="opt-btn" (click)="openWhatsApp('general')">
          <span class="opt-icon general-icon">
            <span class="material-symbols-outlined">chat</span>
          </span>
          <div class="opt-info">
            <strong>General WhatsApp Chat</strong>
            <span>Direct contractor communication</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Main Button (FAB) -->
  <button 
    type="button" 
    class="whatsapp-fab-btn" 
    (click)="toggleMenu()" 
    title="Chat on WhatsApp" 
    aria-label="WhatsApp Assistant">
    <span class="pulse-ring"></span>
    <svg class="wa-svg" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.81 13.47 3.81 11.91C3.81 7.37 7.5 3.67 12.05 3.67M9.53 7.5C9.36 7.5 9.09 7.57 8.87 7.8C8.64 8.04 8 8.64 8 9.87C8 11.1 8.9 12.28 9.03 12.45C9.15 12.62 10.79 15.15 13.3 16.23C13.9 16.49 14.37 16.64 14.73 16.76C15.33 16.95 15.88 16.92 16.31 16.86C16.8 16.79 17.8 16.25 18.01 15.66C18.22 15.07 18.22 14.56 18.16 14.46C18.09 14.36 17.93 14.3 17.68 14.18C17.43 14.05 16.23 13.46 16 13.38C15.78 13.3 15.61 13.26 15.45 13.51C15.28 13.75 14.81 14.3 14.66 14.46C14.5 14.63 14.36 14.65 14.11 14.53C13.86 14.4 12.82 14.06 11.58 12.96C10.62 12.1 9.97 11.04 9.85 10.83C9.72 10.62 9.83 10.51 9.96 10.38C10.07 10.27 10.2 10.09 10.33 9.95C10.45 9.8 10.5 9.69 10.58 9.53C10.66 9.36 10.62 9.22 10.56 9.1C10.5 8.97 10.01 7.77 9.8 7.28C9.6 6.8 9.4 6.86 9.25 6.86C9.11 6.85 8.94 6.85 8.78 6.85L9.53 7.5Z"/>

</div>
