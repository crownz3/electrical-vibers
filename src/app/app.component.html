<div class="app-root-shell" [class.is-admin-view]="isAdminRoute">
  <!-- Top Electric Global Loading Progress Bar for All API / Network Calls -->
  <div *ngIf="loadingService.isLoading$ | async" class="global-api-loader" role="progressbar" aria-label="Loading content">
    <div class="loader-indeterminate-bar"></div>
  </div>

  <app-header *ngIf="!isAdminRoute"></app-header>
  <main class="app-main-content">
    <router-outlet></router-outlet>
  </main>
  <app-footer *ngIf="!isAdminRoute"></app-footer>
  <app-side-cart *ngIf="!isAdminRoute"></app-side-cart>
  <app-floating-whatsapp *ngIf="!isAdminRoute"></app-floating-whatsapp>
</div>
