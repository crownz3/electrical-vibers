  <!-- Immediate Theme Pre-Initialization -->
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('electrical_vibers_theme_pref_v1') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add('theme-' + theme);
      } catch (e) {}
    })();
  </script>
